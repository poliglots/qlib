qlib_init:
    provider_uri: "~/.qlib/qlib_data/nse_data"
    region: in

market: &market all
benchmark: &benchmark null

data_handler_config: &data_handler_config
    start_time: 2020-01-01
    end_time: 2026-04-05
    fit_start_time: 2020-01-01
    fit_end_time: 2022-12-31
    instruments: *market

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 10
            n_drop: 2
    backtest:
        start_time: 2024-01-01
        end_time: 2026-04-05
        account: 10000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.2
            deal_price: close
            open_cost: 0.001
            close_cost: 0.002
            min_cost: 20

task:
    model:
        class: XGBModel
        module_path: qlib.contrib.model.xgboost
        kwargs:
            eval_metric: rmse
            colsample_bytree: 0.8879
            eta: 0.0421
            max_depth: 8
            n_estimators: 647
            subsample: 0.8789
            nthread: 4
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2020-01-01, 2022-12-31]
                valid: [2023-01-01, 2023-12-31]
                test: [2024-01-01, 2026-04-05]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              model: <MODEL>
              dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              ana_long_short: False
              ann_scaler: 252
