qlib_init:
    provider_uri: "~/.qlib/qlib_data/nse_data"
    region: in

market: &market all
benchmark: &benchmark null

data_handler_config: &data_handler_config
    start_time: 2020-01-01
    end_time: 2026-04-05
    fit_start_time: 2020-01-01
    fit_end_time: 2022-12-31
    instruments: *market
    infer_processors:
        - class: RobustZScoreNorm
          kwargs:
              fields_group: feature
              clip_outlier: true
        - class: Fillna
          kwargs:
              fields_group: feature
    learn_processors:
        - class: DropnaLabel
        - class: CSRankNorm
          kwargs:
              fields_group: label
    label: ["Ref($close, -2) / Ref($close, -1) - 1"]

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 10
            n_drop: 2
    backtest:
        start_time: 2024-01-01
        end_time: 2026-04-05
        account: 10000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.2
            deal_price: close
            open_cost: 0.001
            close_cost: 0.002
            min_cost: 20

task:
    model:
        class: TabnetModel
        module_path: qlib.contrib.model.pytorch_tabnet
        kwargs:
            d_feat: 158
            pretrain: True
            seed: 993
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                pretrain: [2020-01-01, 2022-12-31]
                pretrain_validation: [2023-01-01, 2023-12-31]
                train: [2020-01-01, 2022-12-31]
                valid: [2023-01-01, 2023-12-31]
                test: [2024-01-01, 2026-04-05]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              model: <MODEL>
              dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              ana_long_short: False
              ann_scaler: 252
